# Builds, tests and packages grainsexuell for Windows x64, macOS (universal: Intel + Apple Silicon) and Linux x64.
# A tag push (or a manual run with a release tag) attaches the zips and installers to that tag's GitHub release
# (a draft is created if none exists); other runs keep them as short-lived workflow artifacts.
name: build

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Attach the files to the release of this tag (e.g. v0.3.0); empty = artifacts only"
        required: false

permissions:
  contents: write # release assets

env:
  PLUGINVAL_VERSION: v1.0.4

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-2022
            pluginval_asset: pluginval_Windows.zip
            pluginval_bin: ./pluginval.exe
          - name: macos-universal
            os: macos-14
            pluginval_asset: pluginval_macOS.zip
            pluginval_bin: ./pluginval.app/Contents/MacOS/pluginval
          - name: linux-x64
            os: ubuntu-22.04
            pluginval_asset: pluginval_Linux.zip
            pluginval_bin: ./pluginval
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v5

      - name: Linux packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libjack-jackd2-dev libfreetype-dev libfontconfig1-dev \
            libx11-dev libxcomposite-dev libxcursor-dev libxext-dev libxinerama-dev libxrandr-dev libxrender-dev \
            libgl1-mesa-dev xvfb ninja-build

      - name: Configure
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" -DCMAKE_OSX_DEPLOYMENT_TARGET=10.13
          elif [ "$RUNNER_OS" = "Linux" ]; then
            cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          else
            cmake -B build
          fi

      - name: Build
        run: cmake --build build --config Release --parallel 4

      - name: Test
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            xvfb-run -a ctest --test-dir build -C Release --output-on-failure
          else
            ctest --test-dir build -C Release --output-on-failure
          fi

      - name: pluginval (strictness 5)
        run: |
          curl -sSL -o pluginval.zip "https://github.com/Tracktion/pluginval/releases/download/${PLUGINVAL_VERSION}/${{ matrix.pluginval_asset }}"
          unzip -q -o pluginval.zip
          VST3="build/grainsexuell_artefacts/Release/VST3/grainsexuell.vst3"
          if [ "$RUNNER_OS" = "Linux" ]; then
            xvfb-run -a ${{ matrix.pluginval_bin }} --strictness-level 5 --validate-in-process "$VST3"
          else
            ${{ matrix.pluginval_bin }} --strictness-level 5 --validate-in-process "$VST3"
          fi

      - name: Package
        run: |
          VERSION=$(sed -n 's/^#define AppVersion "\(.*\)"/\1/p' installer/grainsexuell.iss)
          OUT="grainsexuell-beta-${VERSION}-${{ matrix.name }}"
          A=build/grainsexuell_artefacts/Release
          mkdir -p "$OUT"
          cp installer/README.txt "$OUT/"
          cp -R "$A/VST3/grainsexuell.vst3" "$OUT/"
          if [ "$RUNNER_OS" = "macOS" ]; then
            cp -R "$A/AU/grainsexuell.component" "$OUT/"
            cp -R "$A/Standalone/grainsexuell.app" "$OUT/"
            cp installer/INSTALL_mac.txt "$OUT/"
            # ad-hoc signature: required for Apple Silicon to load the code at all (not a notarization)
            for b in "$OUT/grainsexuell.vst3" "$OUT/grainsexuell.component" "$OUT/grainsexuell.app"; do
              codesign --force --deep --sign - "$b"
            done
            lipo -info "$OUT/grainsexuell.vst3/Contents/MacOS/grainsexuell"
            ditto -c -k --keepParent "$OUT" "$OUT.zip"
            # installer: one component per format, so "Customize" can leave one out; files a .pkg lays down are
            # not quarantined, so no xattr step (the unsigned .pkg itself still needs right-click > Open)
            for c in "vst3:grainsexuell.vst3:/Library/Audio/Plug-Ins/VST3" "au:grainsexuell.component:/Library/Audio/Plug-Ins/Components" "app:grainsexuell.app:/Applications"; do
              IFS=: read -r id bundle dest <<< "$c"
              mkdir -p "pkgroot/$id" && cp -R "$OUT/$bundle" "pkgroot/$id/"
              pkgbuild --root "pkgroot/$id" --install-location "$dest" --identifier "com.beatsexuell.grainsexuell.$id" \
                --version "$VERSION" "pkg-$id.pkg"
            done
            cat > distribution.xml <<EOF
          <?xml version="1.0" encoding="utf-8"?>
          <installer-gui-script minSpecVersion="2">
            <title>grainsexuell ${VERSION} beta</title>
            <options customize="allow" require-scripts="false" hostArchitectures="x86_64,arm64"/>
            <choices-outline><line choice="vst3"/><line choice="au"/><line choice="app"/></choices-outline>
            <choice id="vst3" title="VST3 plugin"><pkg-ref id="com.beatsexuell.grainsexuell.vst3"/></choice>
            <choice id="au" title="Audio Unit (Logic, GarageBand)"><pkg-ref id="com.beatsexuell.grainsexuell.au"/></choice>
            <choice id="app" title="Standalone app"><pkg-ref id="com.beatsexuell.grainsexuell.app"/></choice>
            <pkg-ref id="com.beatsexuell.grainsexuell.vst3">pkg-vst3.pkg</pkg-ref>
            <pkg-ref id="com.beatsexuell.grainsexuell.au">pkg-au.pkg</pkg-ref>
            <pkg-ref id="com.beatsexuell.grainsexuell.app">pkg-app.pkg</pkg-ref>
          </installer-gui-script>
          EOF
            productbuild --distribution distribution.xml --package-path . "grainsexuell-beta-${VERSION}-mac-installer.pkg"
          elif [ "$RUNNER_OS" = "Linux" ]; then
            cp -R "$A/LV2/grainsexuell.lv2" "$OUT/"
            cp "$A/Standalone/grainsexuell" "$OUT/"
            cp installer/INSTALL_linux.txt "$OUT/"
            zip -q -r "$OUT.zip" "$OUT"
          else
            cp "$A/Standalone/grainsexuell.exe" "$OUT/"
            7z a -bd "$OUT.zip" "$OUT" > /dev/null
            choco install innosetup -y --no-progress > /dev/null
            "/c/Program Files (x86)/Inno Setup 6/ISCC.exe" installer/grainsexuell.iss
            cp build/installer/*.exe .
          fi
          echo "PACKAGE=$OUT" >> "$GITHUB_ENV"

      - name: Attach to release
        if: github.ref_type == 'tag' || inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          # a tag push creates a draft; a manual run with release_tag leaves an existing release as it is (published stays published)
          draft: ${{ inputs.release_tag == '' }}
          fail_on_unmatched_files: false
          files: |
            ${{ env.PACKAGE }}.zip
            *-setup.exe
            *-mac-installer.pkg

      - name: Keep as artifact
        if: github.ref_type != 'tag' && inputs.release_tag == ''
        uses: actions/upload-artifact@v5
        continue-on-error: true # the private-repo artifact quota can be full; the build itself still counts
        with:
          name: ${{ env.PACKAGE }}
          retention-days: 3
          path: |
            ${{ env.PACKAGE }}.zip
            *-setup.exe
            *-mac-installer.pkg
          if-no-files-found: error
